<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAE 레이어 — 연결 지도</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --c:#c8a97e; --a:#7eb8c8; --e:#7ec89a;
    --bg:#0d0d0d; --surface:#141414; --border:#2a2a2a;
    --text:#e8e8e8; --muted:#555;
  }
  :root.light {
    --bg:#f5f3ef; --surface:#eceae4; --border:#d5d0c8;
    --text:#1a1a1a; --muted:#888;
  }
  :root.light .conn-item { background:#e2ddd7; }
  :root.light .ex-box { background:rgba(0,0,0,0.03); }
  :root.light .info-empty { color:#aaa; }

  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Noto Serif KR',serif;
    width:100vw;height:100vh;overflow:hidden;
    display:flex;flex-direction:column;
  }

  /* NAV */
  nav{
    display:flex;align-items:center;gap:12px;
    padding:10px 16px;border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .nav-title{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--muted);}
  .legend{display:flex;gap:12px;}
  .leg{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);}
  .dot{width:8px;height:8px;border-radius:50%;}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .theme-btn{
    background:none;border:1px solid var(--border);border-radius:20px;
    padding:3px 10px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--muted);transition:all 0.2s;
  }
  .theme-btn:hover{color:var(--text);}
  .nav-link{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--muted);text-decoration:none;
    padding:3px 10px;border:1px solid var(--border);border-radius:2px;
  }

  /* 위: 캔버스 */
  #canvas-wrap{
    flex:1;
    min-height:0;
    position:relative;
  }
  #canvas{width:100%;height:100%;display:block;}

  /* 아래: 정보 패널 */
  #info{
    height:220px;
    flex-shrink:0;
    border-top:1px solid var(--border);
    display:flex;
    overflow:hidden;
  }

  /* 왼쪽: 노드 기본 정보 */
  .info-main{
    width:240px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow:hidden;
  }
  .info-code{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;}
  .info-name{font-size:13px;font-weight:700;}
  .info-desc{font-size:11px;line-height:1.7;color:#999;overflow-y:auto;flex:1;}

  /* 가운데: 연결 목록 */
  .info-conn{
    width:260px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    padding:14px 16px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .conn-section-label{
    font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:2px;color:var(--muted);text-transform:uppercase;
    margin-bottom:4px;
  }
  .conn-list{display:flex;flex-direction:column;gap:4px;}
  .conn-item{
    display:flex;align-items:flex-start;gap:6px;
    padding:6px 8px;background:var(--surface);
    border:1px solid var(--border);border-radius:3px;
    cursor:pointer;transition:border-color 0.15s;
  }
  .conn-item:hover{border-color:#555;}
  .conn-arrow{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);min-width:12px;margin-top:2px;}
  .conn-code{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;min-width:24px;margin-top:1px;}
  .conn-text{font-size:10px;color:#999;line-height:1.5;}

  /* 오른쪽: 실제 사례 */
  .info-example{
    flex:1;
    padding:14px 18px;
    overflow-y:auto;
  }
  .ex-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
  .ex-title{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  .ex-text{font-size:11px;line-height:1.8;color:#999;}
  .ex-text em{font-style:normal;font-weight:700;color:#ccc;}
  :root.light .ex-text em{color:#333;}

  /* 빈 상태 */
  .info-empty{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;
    font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--muted);letter-spacing:2px;
    flex-direction:column;gap:8px;
  }

  /* 모바일 */
  @media(max-width:600px){
    #info{height:240px;flex-direction:column;}
    .info-main{width:100%;border-right:none;border-bottom:1px solid var(--border);padding:10px 14px;height:auto;flex-shrink:0;}
    .info-conn{width:100%;border-right:none;border-bottom:1px solid var(--border);height:120px;}
    .info-example{display:none;}
  }
</style>
</head>
<body>

<nav>
  <span class="nav-title">CAE — MAP</span>
  <div class="legend">
    <div class="leg"><div class="dot" style="background:var(--c)"></div>제약 C</div>
    <div class="leg"><div class="dot" style="background:var(--a)"></div>조정 A</div>
    <div class="leg"><div class="dot" style="background:var(--e)"></div>표현 E</div>
  </div>
  <div class="nav-right">
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☀ 라이트</button>
    <a href="index.html" class="nav-link">← 상세</a>
  </div>
</nav>

<div id="canvas-wrap">
  <svg id="canvas"></svg>
</div>

<div id="info">
  <div class="info-empty" id="info-empty" style="width:100%">
    <span style="font-size:20px;opacity:0.2">◎</span>
    <span>노드를 클릭하면 연결 관계가 나타납니다</span>
  </div>
  <div class="info-main" id="info-main" style="display:none">
    <div class="info-code" id="i-code"></div>
    <div class="info-name" id="i-name"></div>
    <div class="info-desc" id="i-desc"></div>
  </div>
  <div class="info-conn" id="info-conn" style="display:none"></div>
  <div class="info-example" id="info-example" style="display:none"></div>
</div>

<script>
const C='#c8a97e',A='#7eb8c8',E='#7ec89a',MUTED='#333';
function tc(t){return t==='C'?C:t==='A'?A:E;}
function getSurface(){return getComputedStyle(document.documentElement).getPropertyValue('--surface').trim()||'#141414';}
function getBg(){return getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#0d0d0d';}

const nodes=[
  {id:'C1',name:'시간·에너지·물리',type:'C'},
  {id:'C2',name:'태양·지구·기후',type:'C'},
  {id:'C3',name:'생태계·인구구조',type:'C'},
  {id:'C4',name:'자원·희소성',type:'C'},
  {id:'A1',name:'국가·권력·주권',type:'A'},
  {id:'A2',name:'패권·안보·전쟁',type:'A'},
  {id:'A3',name:'규칙·법·정책',type:'A'},
  {id:'A4',name:'연구·기술·과학',type:'A'},
  {id:'A5',name:'산업',type:'A'},
  {id:'A6',name:'기업·전략·실행',type:'A'},
  {id:'E1',name:'자본시장·금융',type:'E'},
  {id:'E2',name:'실물경제',type:'E'},
  {id:'E3',name:'개인·소비',type:'E'},
  {id:'E4',name:'사회·갈등',type:'E'},
  {id:'E5',name:'정치',type:'E'},
];

const edges=[
  {from:'C1',to:'A4',label:'물리 법칙이 기술 개발의 방향을 제약'},
  {from:'C1',to:'E1',label:'비가역성·복리 원리가 자본시장의 기본 전제'},
  {from:'C2',to:'C3',label:'기후 변화가 생태계·서식지를 바꿈'},
  {from:'C2',to:'A3',label:'기후 비용이 탄소 규범·정책을 만들어냄'},
  {from:'C2',to:'E2',label:'폭염·홍수·가뭄이 식량·에너지 물가에 반영'},
  {from:'C3',to:'C4',label:'인구 증가·생태 변화가 자원 소비 압력 증대'},
  {from:'C3',to:'A1',label:'인구 구조가 국가 재정·복지 정책 방향 결정'},
  {from:'C3',to:'E3',label:'인구 고령화가 개인 소비 패턴 변화'},
  {from:'C4',to:'A2',label:'희소 자원 분포가 지정학적 긴장 유발'},
  {from:'C4',to:'A4',label:'자원 제약이 대체 기술 개발 동기 부여'},
  {from:'C4',to:'E2',label:'원자재 희소성이 물가·생산비용에 반영'},
  {from:'A1',to:'A2',label:'국가 목표함수가 안보 전략 방향 결정'},
  {from:'A1',to:'A3',label:'권력 구조가 법·제도·정책을 설계'},
  {from:'A1',to:'E1',label:'국가 재정·채권 발행이 금리·유동성에 영향'},
  {from:'A2',to:'A3',label:'패권 경쟁이 관세·제재·산업정책으로 구현'},
  {from:'A2',to:'C4',label:'전쟁·봉쇄가 자원 공급망을 차단'},
  {from:'A2',to:'E1',label:'지정학 리스크가 금융시장 변동성에 반영'},
  {from:'A2',to:'E2',label:'호르무즈 봉쇄 → 유가 급등 → 물가 상승'},
  {from:'A3',to:'A5',label:'산업정책·보조금이 특정 산업 육성·억제'},
  {from:'A3',to:'A6',label:'세금·규제가 기업 이익 구조와 투자 유인 변화'},
  {from:'A3',to:'E1',label:'통화정책(금리)이 자본시장 조건 결정'},
  {from:'A3',to:'E2',label:'재정정책이 고용·물가·성장에 직접 영향'},
  {from:'A4',to:'A5',label:'기술이 산업 표준·공급망 구조 재편'},
  {from:'A4',to:'A6',label:'R&D가 기업 경쟁 우위와 비용 구조 결정'},
  {from:'A4',to:'C4',label:'기술 혁신이 자원 제약의 경계를 확장'},
  {from:'A5',to:'A6',label:'산업 구조가 기업의 가격결정력·마진 결정'},
  {from:'A5',to:'E1',label:'CAPEX 사이클이 신용·투자 지표에 반영'},
  {from:'A5',to:'E2',label:'생산능력 변화가 공급·고용·무역에 영향'},
  {from:'A6',to:'E1',label:'기업 실적·현금흐름이 주가·신용에 반영'},
  {from:'A6',to:'E2',label:'고용·투자·생산이 실물경제 지표로 집계'},
  {from:'A6',to:'E3',label:'제품·가격정책이 개인 소비 패턴 변화'},
  {from:'E1',to:'A3',label:'금리 급등·시장 발작이 정책 대응 강제'},
  {from:'E1',to:'A6',label:'자금조달 비용이 기업 투자·CAPEX 결정'},
  {from:'E1',to:'E2',label:'금융 여건이 실물 투자·소비에 파급'},
  {from:'E2',to:'E1',label:'물가·고용 지표가 금리 기대 재조정'},
  {from:'E2',to:'E3',label:'임금·물가·고용이 개인 생활 조건 결정'},
  {from:'E3',to:'E2',label:'집단 소비 변화가 실물경제 집계 지표로 반영'},
  {from:'E3',to:'E4',label:'체감 악화가 집단화되면 사회 갈등으로 전이'},
  {from:'E4',to:'E5',label:'사회 갈등·신뢰 붕괴가 정치적 압력으로 표현'},
  {from:'E5',to:'A3',label:'정치 상태 변화가 정책 방향·속도 재설계'},
  {from:'E5',to:'A1',label:'선거·권력 교체가 국가 목표함수 재설정'},
];

const nodeData={
  C1:{desc:'시간은 되돌릴 수 없고, 에너지는 공짜로 생기지 않는다. 작은 것들이 쌓여 임계점을 넘으면 한꺼번에 터진다.',ex:{title:'복리와 시간',text:'지금 1.17억이 <em>35년</em> 굴러가면 연 10%에서 <em>명목 73억</em>이 된다. 중간에 패닉셀 한 번이 복리 기반을 영구적으로 훼손한다.'}},
  C2:{desc:'태양과 지구의 에너지 균형이 바뀌면 기후가 변한다. 기후는 식량·보험·전력·인프라 비용 구조 전체를 흔든다.',ex:{title:'기후와 에너지 전환',text:'유럽 탄소국경세(A3)는 C2 압력이 A3로 전달된 사례다. 철강·시멘트 <em>비용 구조(A5)</em>를 바꾸고 <em>신재생 주식(E1)</em>에 반영된다.'}},
  C3:{desc:'생태계 네트워크와 인구 구조가 만드는 경계. 인구 고령화는 10~30년에 걸쳐 노동·재정·소비·정치 전반을 바꾼다.',ex:{title:'한국의 인구 구조',text:'고령화(C3)는 국민연금 고갈 우려(A3)로 이어지고, <em>헬스케어·요양 산업(A5)</em> 성장과 <em>소비재 구조(E3)</em> 변화로 나타난다.'}},
  C4:{desc:'물·토지·광물·식량은 한정되어 있다. 좋은 조건부터 먼저 쓰기 때문에 시간이 갈수록 단위당 투입량이 구조적으로 증가한다.',ex:{title:'우라늄과 희소성',text:'우라늄(C4)은 고품위 광산부터 소진된다. 에너지 안보(A2) 수요가 겹치면서 원전 확대(A5)가 진행되고 <em>URA(E1)</em> 가격에 반영된다.'}},
  A1:{desc:'법·제도를 만들고 강제 집행할 수 있는 최상위 의사결정 주체. 목표함수가 바뀌면 아래 레이어 전체가 한꺼번에 정렬된다.',ex:{title:'트럼프 재집권',text:'재집권(E5→A1)으로 목표함수가 자유무역에서 <em>자국 우선 산업보호(A3)</em>로 전환됐다. 관세·IRA가 <em>반도체·전기차 산업(A5)</em>을 재편한다.'}},
  A2:{desc:'힘의 배치와 균형. 전쟁이 없어도 항로·자원·기술을 통한 패권 경쟁은 상시 작동한다.',ex:{title:'중동전쟁과 포트폴리오',text:'이란-미국 긴장(A2)이 호르무즈 봉쇄로 이어져 <em>유가 급등(E2)</em>. 금리 인상 가능성(E1) 연결, 방산(RTX·GEV) 수혜, 고PER 주식 압박.'}},
  A3:{desc:'인센티브와 페널티의 설계. 세금·금융규칙·산업정책·국제 통상이 개인과 기업의 선택을 바꾼다.',ex:{title:'워시 연준 딜레마',text:'FOMC "인플레 지속 시 금리인상 적절"(A3)이 <em>국채금리 급등(E1)</em>으로 이어지고, 기업 자금조달 비용(A6)을 올리며 <em>고PER 주식 조정 압력</em>으로 연결된다.'}},
  A4:{desc:'제약의 경계를 미는 지식 엔진. 발견(실험실) → 규모화(공장) → 채택(사회) 3단계가 모두 다르다.',ex:{title:'GLP-1과 세마글루타이드',text:'세마글루타이드는 A4(분자 발견)에서 시작해 NVO·LLY(A6)가 규모화했다. GLP-1 침투율 ~2%는 <em>A4→A5 전환이 초기</em>라는 뜻.'}},
  A5:{desc:'기술과 규칙이 대량화로 굳어지는 구조. 표준 채택 → CAPEX → 장기 계약으로 수요가 잠기면 되돌리기 어렵다.',ex:{title:'데이터센터 전력 수요',text:'AI 하이퍼스케일러의 장기 전력 계약(A5 진입)이 <em>EQIX·GEV(A6)</em> 수요를 잠갔다. CAPEX 집행 후 되돌리기 어려워 테마 지속성이 높아진다.'}},
  A6:{desc:'산업 위에서 성과를 내는 주체. 비가역적 자본배분 선택과 실행력의 차이로 승패가 갈린다.',ex:{title:'NVO CAPEX와 FCF',text:'NVO의 2027~2029 공장 증설(A6 비가역적 선택)이 FCF를 일시 압축한다. GLP-1 수요(A5)와 맞물리면 <em>2028년 FCF 회복(E1 재평가)</em>으로 연결된다.'}},
  E1:{desc:'C와 A의 누적을 가격으로 압축해 보여주는 계기판. 임계치를 넘으면 금리·신용·유동성으로 모든 레이어를 강제한다.',ex:{title:'30년물 5% 돌파',text:'A1(재정 확대)·A2(중동 리스크)·A3(금리인상 가능성)·C4(에너지 비용)가 누적된 결과. 다시 <em>고PER 주식 할인율 상승</em>으로 피드백된다.'}},
  E2:{desc:'수많은 주체들의 선택이 집계되어 나타난 결과. 방향이 바뀌면 E1을 리프라이싱하고 E3에 체감으로 전달된다.',ex:{title:'제조업 투입가격 급등',text:'5월 투입가격지수 68→79(E2)는 A2(중동전쟁)→C4(에너지)의 전달 결과. <em>CPI 상회(E2)</em>→ <em>금리인상 확률(E1)</em> 상승으로 이어진다.'}},
  E3:{desc:'상위 레이어의 누적이 삶으로 드러나는 지점. 핵심은 평균이 아닌 분포와 체감이다.',ex:{title:'고금리와 가계 압박',text:'국채금리 5%(E1)가 주택담보대출로 전달되면 변동금리 대출자 이자 부담 급증. <em>재량 소비 축소(E3)</em>→ <em>소비 지표 둔화(E2)</em>→ E1 리프라이싱.'}},
  E4:{desc:'개인 체감이 집단화된 구조. 신뢰가 낮으면 작은 충격도 큰 갈등이 된다.',ex:{title:'인플레이션과 정치 압력',text:'에너지·식료품 물가 급등(E2)→ 개인 생활비 압박(E3)→ "정책 실패" 서사(E4)→ <em>정권 교체·포퓰리즘(E5)</em>→ A1·A3 재설계.'}},
  E5:{desc:'표현→조정의 연결점. 정치 상태가 변하면 A3로 넘어가 레이어 전체를 재정렬한다.',ex:{title:'워시 연준 체제 전환',text:'트럼프 재선(E5)이 워시 체제 전환(A1→A3)을 가능하게 했다. 워시의 목표(금리인하+QT)가 현재 E2와 충돌하면서 <em>정책 불확실성 프리미엄(E1)</em>이 올라가고 있다.'}},
};

// 레이아웃: 좌→우 (C | A | E)
// C: col 0 (4개), A: col 1 (6개), E: col 2 (5개)
const colMap={C:0,A:1,E:2};
const colNodes={C:['C1','C2','C3','C4'],A:['A1','A2','A3','A4','A5','A6'],E:['E1','E2','E3','E4','E5']};

let selected=null;
let W,H,svgEl;

function getPos(id){
  const n=nodes.find(x=>x.id===id);
  const col=colMap[n.type];
  const colArr=colNodes[n.type];
  const idx=colArr.indexOf(id);
  const cnt=colArr.length;
  const padX=0.08, padY=0.08;
  const colW=(1-padX*2)/3;
  const x=(padX+col*colW+colW/2)*W;
  const y=(padY+(idx+0.5)/cnt*(1-padY*2))*H;
  return {x,y};
}

function init(){
  svgEl=document.getElementById('canvas');
  resize();
  window.addEventListener('resize',()=>{resize();draw();});
  draw();
}

function resize(){
  const wrap=document.getElementById('canvas-wrap');
  W=wrap.clientWidth;
  H=wrap.clientHeight;
  svgEl.setAttribute('width',W);
  svgEl.setAttribute('height',H);
}

function draw(){
  svgEl.innerHTML='';
  drawBands();
  edges.forEach(e=>drawEdge(e));
  nodes.forEach(n=>drawNode(n));
}

function drawBands(){
  const bands=[
    {col:0,color:C,label:'C — 제약'},
    {col:1,color:A,label:'A — 조정'},
    {col:2,color:E,label:'E — 표현'},
  ];
  const padX=0.08, padY=0.04;
  const colW=(1-padX*2)/3;
  bands.forEach(b=>{
    const x=(padX+b.col*colW)*W;
    const rgb=b.color===C?'200,169,126':b.color===A?'126,184,200':'126,200,154';
    svgEl.appendChild(ms('rect',{
      x:x+4, y:padY*H,
      width:colW*W-8, height:(1-padY*2)*H,
      rx:6,
      fill:`rgba(${rgb},0.05)`,
      stroke:`rgba(${rgb},0.18)`,
      'stroke-width':1
    }));
    const t=ms('text',{
      x:x+colW*W/2, y:(padY+0.04)*H,
      fill:b.color,'font-size':10,
      'font-family':'JetBrains Mono, monospace',
      'text-anchor':'middle','letter-spacing':2,opacity:0.7
    });
    t.textContent=b.label;
    svgEl.appendChild(t);
  });
}

function drawEdge(e){
  const fp=getPos(e.from),tp=getPos(e.to);
  const fn=nodes.find(n=>n.id===e.from);
  const tn=nodes.find(n=>n.id===e.to);
  const isConn=selected&&(e.from===selected||e.to===selected);
  const hasSel=selected!==null;
  const op=hasSel?(isConn?0.8:0.04):0.13;
  const sw=isConn?2:1;
  const color=isConn?(e.from===selected?tc(fn.type):tc(tn.type)):MUTED;

  const mx=(fp.x+tp.x)/2;
  const my=(fp.y+tp.y)/2-Math.abs(fp.y-tp.y)*0.1;

  const defs=svgEl.querySelector('defs')||(() => {const d=ms('defs',{});svgEl.insertBefore(d,svgEl.firstChild);return d;})();
  const mid=`mk-${e.from}-${e.to}`;
  const mk=ms('marker',{id:mid,markerWidth:6,markerHeight:6,refX:5,refY:3,orient:'auto'});
  mk.appendChild(ms('path',{d:'M0,0 L0,6 L6,3 z',fill:color,opacity:op}));
  defs.appendChild(mk);

  svgEl.appendChild(ms('path',{
    d:`M${fp.x},${fp.y} Q${mx},${my} ${tp.x},${tp.y}`,
    stroke:color,'stroke-width':sw,fill:'none',opacity:op,
    'marker-end':`url(#${mid})`
  }));
}

function drawNode(n){
  const p=getPos(n.id);
  const color=tc(n.type);
  const isSel=selected===n.id;
  const isConn=selected&&edges.some(e=>
    (e.from===n.id&&e.to===selected)||(e.to===n.id&&e.from===selected)||
    (e.from===selected&&e.to===n.id)||(e.to===selected&&e.from===n.id)
  );
  const hasSel=selected!==null;
  const op=hasSel?(isSel||isConn?1:0.2):1;
  const r=isSel?30:22;

  const g=ms('g',{transform:`translate(${p.x},${p.y})`,style:'cursor:pointer',opacity:op});
  if(isSel){g.appendChild(ms('circle',{r:40,fill:color,opacity:0.08}));}
  g.appendChild(ms('circle',{r,fill:getSurface(),stroke:color,'stroke-width':isSel?2.5:1}));

  const code=ms('text',{'text-anchor':'middle','dominant-baseline':'central',
    fill:color,'font-size':11,'font-weight':700,
    'font-family':'JetBrains Mono, monospace',y:-5});
  code.textContent=n.id;
  g.appendChild(code);

  const nm=ms('text',{'text-anchor':'middle','dominant-baseline':'central',
    fill:'#777','font-size':8,'font-family':'Noto Serif KR, serif',y:8});
  nm.textContent=n.name.split('·')[0];
  g.appendChild(nm);

  g.addEventListener('click',()=>selectNode(n.id));
  svgEl.appendChild(g);
}

function selectNode(id){
  selected=selected===id?null:id;
  draw();
  renderInfo(selected);
}

function renderInfo(id){
  const empty=document.getElementById('info-empty');
  const main=document.getElementById('info-main');
  const conn=document.getElementById('info-conn');
  const example=document.getElementById('info-example');

  if(!id){
    empty.style.display='flex';
    main.style.display='none';
    conn.style.display='none';
    example.style.display='none';
    return;
  }

  const n=nodes.find(x=>x.id===id);
  const d=nodeData[id];
  const color=tc(n.type);
  const outE=edges.filter(e=>e.from===id);
  const inE=edges.filter(e=>e.to===id);

  empty.style.display='none';
  main.style.display='flex';
  conn.style.display='flex';
  example.style.display='block';

  // 메인
  document.getElementById('i-code').textContent=n.id;
  document.getElementById('i-code').style.color=color;
  document.getElementById('i-name').textContent=n.name;
  document.getElementById('i-desc').textContent=d.desc;

  // 연결
  let html='';
  if(outE.length){
    html+=`<div><div class="conn-section-label" style="color:${color}">영향 주는 곳 →</div><div class="conn-list">`;
    outE.forEach(e=>{
      const tn=nodes.find(x=>x.id===e.to);
      html+=`<div class="conn-item" onclick="selectNode('${e.to}')">
        <div class="conn-arrow" style="color:${color}">→</div>
        <div class="conn-code" style="color:${tc(tn.type)}">${e.to}</div>
        <div class="conn-text">${e.label}</div>
      </div>`;
    });
    html+=`</div></div>`;
  }
  if(inE.length){
    html+=`<div><div class="conn-section-label">← 영향 받는 곳</div><div class="conn-list">`;
    inE.forEach(e=>{
      const fn=nodes.find(x=>x.id===e.from);
      html+=`<div class="conn-item" onclick="selectNode('${e.from}')">
        <div class="conn-arrow" style="color:${color}">←</div>
        <div class="conn-code" style="color:${tc(fn.type)}">${e.from}</div>
        <div class="conn-text">${e.label}</div>
      </div>`;
    });
    html+=`</div></div>`;
  }
  conn.innerHTML=html;

  // 사례
  example.innerHTML=`
    <div class="ex-label">실제 사례</div>
    <div class="ex-title" style="color:${color}">${d.ex.title}</div>
    <div class="ex-text">${d.ex.text}</div>`;
}

function ms(tag,attrs){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  return el;
}

// 테마
function applyTheme(theme){
  document.documentElement.classList.toggle('light',theme==='light');
  document.getElementById('theme-btn').textContent=theme==='light'?'● 다크':'☀ 라이트';
  localStorage.setItem('cae-theme',theme);
  draw();
}
function toggleTheme(){
  applyTheme(localStorage.getItem('cae-theme')==='light'?'dark':'light');
}

window.selectNode=selectNode;
window.toggleTheme=toggleTheme;
window.addEventListener('load',()=>{
  init();
  applyTheme(localStorage.getItem('cae-theme')||'dark');
});
</script>
</body>
</html>
