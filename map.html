<style>

  :root {
    --c: #c8a97e;
    --a: #7eb8c8;
    --e: #7ec89a;
    --bg: #0d0d0d;
    --surface: #141414;

    --text: #e8e8e8;

  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  nav {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .nav-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
  }

  .nav-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 2px;
    transition: all 0.15s;
    margin-left: auto;
  }
  .nav-link:hover { color: var(--text); border-color: #444; }

  .hint {
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SVG 캔버스 */
  #canvas {
    flex: 1;
    cursor: default;
  }

  /* 사이드 패널 */
  .side {
    width: 340px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .side-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--border);
  }

  .side-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .side-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .side-sub {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  .side-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  .side-section {
    margin-bottom: 24px;
  }

  .side-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .conn-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .conn-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .conn-item:hover { border-color: #444; }

  .conn-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    min-width: 28px;
    margin-top: 1px;
  }

  .conn-text {
    font-size: 12px;
    color: #aaa;
    line-height: 1.6;
  }

  .conn-arrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    min-width: 16px;
    margin-top: 2px;
  }

  .example-box {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px 16px;
  }

  .example-text {
    font-size: 12px;
    line-height: 1.8;
    color: #999;
  }

  .example-text em {
    font-style: normal;
    font-weight: 700;
    color: #ccc;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 32px;
    opacity: 0.3;
  }

  .empty-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.8;
  }

  /* 범례 */
  .legend {
    display: flex;
    gap: 20px;
    padding: 0 28px;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
</style>
</head>

function typeColor(type) {
  return type === 'C' ? C : type === 'A' ? A : E;
}

function init() {
  svgEl = document.getElementById('canvas');
  resize();
  window.addEventListener('resize', () => { resize(); draw(); });
  draw();
}

function resize() {
  const rect = svgEl.parentElement.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  svgEl.setAttribute('width', W);
  svgEl.setAttribute('height', H);
}

function px(node) {
  return {
    x: layout[node.id].x * W,
    y: layout[node.id].y * H,
  };
}

function draw() {
  svgEl.innerHTML = '';

  // 배경 그룹 레이블
  drawGroupBg();

  // 엣지 먼저
  edges.forEach(e => drawEdge(e));

  // 노드
  nodes.forEach(n => drawNode(n));
}

    stroke: 'rgba(126,200,154,0.12)', 'stroke-width': 1
  });
  svgEl.appendChild(eGroup);
  svgEl.appendChild(label(0.08 * W, 0.625 * H, 'E — 표현 (Expression)', E, 10));
}

function label(x, y, text, color, size) {
  const t = makeSvg('text', {
    x, y, fill: color, 'font-size': size,
    'font-family': 'JetBrains Mono, monospace',
    'letter-spacing': 2, opacity: 0.7
  });
  t.textContent = text;
  return t;
}

function drawEdge(e) {
  const from = nodes.find(n => n.id === e.from);
  const to = nodes.find(n => n.id === e.to);
  const fp = px(from), tp = px(to);

  const isConnected = selected && (e.from === selected || e.to === selected);
  const hasSelected = selected !== null;

  const opacity = hasSelected ? (isConnected ? 0.85 : 0.05) : 0.18;
  const strokeW = isConnected ? 1.5 : 1;
  const color = isConnected
    ? (e.from === selected ? typeColor(from.type) : typeColor(to.type))
    : MUTED;

  // 곡선 경로
  const dx = tp.x - fp.x;
  const dy = tp.y - fp.y;
  const cx1 = fp.x + dx * 0.3;
  const cy1 = fp.y + dy * 0.1;
  const cx2 = fp.x + dx * 0.7;
  const cy2 = tp.y - dy * 0.1;

  const id = `edge-${e.from}-${e.to}`;
  const markId = `arrow-${e.from}-${e.to}`;

  // 마커
  const defs = svgEl.querySelector('defs') || (() => { const d = makeSvg('defs',{}); svgEl.insertBefore(d, svgEl.firstChild); return d; })();
  const marker = makeSvg('marker', {
    id: markId, markerWidth: 6, markerHeight: 6,
    refX: 5, refY: 3, orient: 'auto'
  });
  const arrow = makeSvg('path', {
    d: 'M0,0 L0,6 L6,3 z',
    fill: color, opacity
  });
  marker.appendChild(arrow);
  defs.appendChild(marker);

  const path = makeSvg('path', {
    d: `M${fp.x},${fp.y} C${cx1},${cy1} ${cx2},${cy2} ${tp.x},${tp.y}`,
    stroke: color, 'stroke-width': strokeW,
    fill: 'none', opacity,
    'marker-end': `url(#${markId})`,
    id
  });
  svgEl.appendChild(path);
}

function drawNode(n) {
  const p = px(n);
  const isSelected = selected === n.id;
  const isConnected = selected && edges.some(e => (e.from === n.id && e.to === selected) || (e.to === n.id && e.from === selected) || e.from === selected && e.to === n.id || e.to === selected && e.from === n.id);
  const hasSelected = selected !== null;

  const opacity = hasSelected ? (isSelected || isConnected ? 1 : 0.25) : 1;
  const r = isSelected ? 36 : 28;
  const strokeW = isSelected ? 2 : 1;

  const g = makeSvg('g', {
    transform: `translate(${p.x},${p.y})`,
    style: 'cursor:pointer',
    opacity
  });

  // 글로우
  if (isSelected) {
    const glow = makeSvg('circle', {
      r: 44, fill: n.color, opacity: 0.08
    });
    g.appendChild(glow);
  }

  // 원
  const circle = makeSvg('circle', {
    r, fill: SURFACE,
    stroke: n.color, 'stroke-width': strokeW,
  });
  g.appendChild(circle);

  // 코드
  const code = makeSvg('text', {
    'text-anchor': 'middle', 'dominant-baseline': 'central',
    fill: n.color, 'font-size': isSelected ? 13 : 11,
    'font-weight': 700,
    'font-family': 'JetBrains Mono, monospace',
    y: -5
  });
  code.textContent = n.label;
  g.appendChild(code);

  // 이름 (짧게)
  const shortName = n.name.split('·')[0];
  const nameTxt = makeSvg('text', {
    'text-anchor': 'middle', 'dominant-baseline': 'central',
    fill: '#888', 'font-size': 8,
    'font-family': 'Noto Serif KR, serif',
    y: 9
  });
  nameTxt.textContent = shortName;
  g.appendChild(nameTxt);

  g.addEventListener('click', () => onNodeClick(n.id));
  svgEl.appendChild(g);
}

function onNodeClick(id) {
  selected = selected === id ? null : id;
  draw();
  renderSide(selected);
}

function renderSide(id) {
  const side = document.getElementById('side-content');
  if (!id) {
    side.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">◎</div>
        <div class="empty-text">노드를 클릭하면<br>연결 관계와 예시가<br>여기에 나타납니다</div>
      </div>`;
    return;
  }

  const n = nodes.find(x => x.id === id);
  const d = nodeData[id];
  const outEdges = edges.filter(e => e.from === id);
  const inEdges = edges.filter(e => e.to === id);

  const color = typeColor(n.type);

  let html = `
    <div class="side-header" style="border-left: 3px solid ${color}; padding-left: 20px;">
      <div class="side-code" style="color:${color}">${n.label}</div>
      <div class="side-name">${n.name}</div>
      <div class="side-sub">${d.desc}</div>
    </div>
    <div class="side-body">`;

  if (outEdges.length > 0) {
    html += `<div class="side-section">
      <div class="side-label">이 레이어가 영향을 주는 곳 →</div>
      <div class="conn-list">`;
    outEdges.forEach(e => {
      const toNode = nodes.find(x => x.id === e.to);
      const tc = typeColor(toNode.type);
      html += `<div class="conn-item" onclick="onNodeClick('${e.to}')">
        <div class="conn-arrow" style="color:${color}">→</div>
        <div class="conn-code" style="color:${tc}">${e.to}</div>
        <div class="conn-text">${e.label}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  if (inEdges.length > 0) {
    html += `<div class="side-section">
      <div class="side-label">← 이 레이어에 영향을 주는 곳</div>
      <div class="conn-list">`;
    inEdges.forEach(e => {
      const fromNode = nodes.find(x => x.id === e.from);
      const fc = typeColor(fromNode.type);
      html += `<div class="conn-item" onclick="onNodeClick('${e.from}')">
        <div class="conn-arrow" style="color:${color}">←</div>
        <div class="conn-code" style="color:${fc}">${e.from}</div>
        <div class="conn-text">${e.label}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  if (d.example) {
    html += `<div class="side-section">
      <div class="side-label">실제 사례</div>
      <div class="example-box">
        <div class="side-label" style="margin-bottom:8px;color:${color}">${d.example.title}</div>
        <div class="example-text">${d.example.text}</div>
      </div>
    </div>`;
  }

  html += `</div>`;
  side.innerHTML = html;
}

function makeSvg(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

window.onNodeClick = onNodeClick;
window.addEventListener('load', init);
</script>
</body>
</html>
